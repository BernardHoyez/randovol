<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#173b2b">
<meta name="description" content="RANDOVOL — survol 3D de randonnées GPX/KML avec Cesium et altimétrie RGE ALTI IGN.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon192.png">
<title>RANDOVOL — Survol 3D</title>
<link rel="stylesheet" href="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Widgets/widgets.css">
<style>
:root{--bg:#12231b;--panel:#173b2b;--accent:#f2c14e;--text:#f5f5f5}
*{box-sizing:border-box} html,body,#cesiumContainer{width:100%;height:100%;margin:0;overflow:hidden}
body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#000;color:var(--text)}
#panel{position:absolute;z-index:10;left:12px;top:12px;width:min(380px,calc(100vw - 24px));background:rgba(18,35,27,.93);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:14px;box-shadow:0 8px 30px #0008;backdrop-filter:blur(8px)}
h1{font-size:21px;margin:0 0 4px;letter-spacing:.08em} .sub{font-size:12px;opacity:.72;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;margin:8px 0;flex-wrap:wrap}
button,label.file{border:0;border-radius:9px;padding:8px 11px;background:#28563f;color:white;cursor:pointer;font-weight:600}
button:hover,label.file:hover{background:#347050}
button.primary{background:var(--accent);color:#1b241d} button:disabled{opacity:.45;cursor:not-allowed}
input[type=file]{display:none} input[type=range]{width:145px;accent-color:var(--accent)}
select{background:#234b38;color:white;border:1px solid #ffffff33;border-radius:7px;padding:6px}
#status{font-size:12px;line-height:1.35;min-height:32px;margin-top:8px;color:#d9e7df}
#stats{font-size:11px;opacity:.75;margin-top:6px}
#progress{width:100%;height:5px;background:#ffffff22;border-radius:5px;overflow:hidden;margin-top:8px}
#bar{height:100%;width:0;background:var(--accent);transition:width .1s}
.small{font-size:11px;opacity:.75}
#help{position:absolute;right:12px;bottom:12px;z-index:9;background:#12231bcc;padding:7px 10px;border-radius:8px;font-size:11px}
@media(max-width:600px){#panel{padding:11px}.row{margin:6px 0} button,label.file{padding:7px 9px} #help{display:none}}
</style>
</head>
<body>
<div id="cesiumContainer"></div>

<section id="panel">
  <h1>RANDOVOL</h1>
  <div class="sub">Survol 3D de randonnée · Cesium + RGE ALTI® IGN</div>
  <div class="row">
    <label class="file">📂 GPX / KML<input id="file" type="file" accept=".gpx,.kml,.xml,.kmz"></label>
    <button id="demo">Démo</button>
  </div>
  <div class="row">
    <button id="play" class="primary" disabled>▶ Survol</button>
    <button id="pause" disabled>⏸ Pause</button>
    <button id="reset" disabled>↺ Revenir</button>
  </div>
  <div class="row">
    <span>Hauteur</span>
    <input id="height" type="range" min="50" max="500" step="10" value="150">
    <b><span id="heightValue">150</span> m</b>
  </div>
  <div class="row">
    <span>Vitesse</span>
    <select id="speed">
      <option value="0.5">0,5×</option><option value="1" selected>1×</option>
      <option value="1.5">1,5×</option><option value="2">2×</option>
      <option value="3">3×</option><option value="5">5×</option>
    </select>
    <span class="small">≈ 4–20 km/h</span>
  </div>
  <div id="progress"><div id="bar"></div></div>
  <div id="status">Charge une randonnée GPX ou KML.</div>
  <div id="stats"></div>
</section>
<div id="help">Molette : zoom · glisser : vue libre · ESC : quitter le survol</div>

<script src="https://cesium.com/downloads/cesiumjs/releases/1.138/Build/Cesium/Cesium.js"></script>
<script src="app.js"></script>
</body>
</html>
