<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RandoVol</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2b6cb0">
    <meta name="description" content="Générateur PWA de survol KMZ à 150m d'altitude pour Google Earth.">
    
    <!-- Dependencies via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@turf/turf@6/turf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/toGeoJSON/0.16.0/togeojson.min.js"></script>
    
    <style>
        :root {
            --primary: #2b6cb0;
            --primary-hover: #2c5282;
            --bg: #f7fafc;
            --card-bg: #ffffff;
            --text: #2d3748;
            --text-muted: #718096;
            --border: #e2e8f0;
            --accent: #319795;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            margin: auto;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 6px;
        }

        p.subtitle {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .drop-zone {
            border: 2px dashed var(--primary);
            border-radius: 8px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            background-color: #ebf8ff;
            transition: all 0.2s ease;
            margin-bottom: 20px;
        }

        .drop-zone:hover, .drop-zone.dragover {
            background-color: #bee3f8;
            border-color: var(--primary-hover);
        }

        .drop-zone p {
            font-weight: 500;
            color: var(--primary-hover);
            margin-bottom: 8px;
        }

        .drop-zone span {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        input[type="file"] {
            display: none;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .control-group {
            display: flex;
            flex-direction: column;
        }

        .control-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text);
        }

        input[type="number"], select {
            padding: 8px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 0.9rem;
            outline: none;
        }

        input[type="number"]:focus, select:focus {
            border-color: var(--primary);
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
            text-align: center;
            text-decoration: none;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:disabled {
            background-color: #cbd5e0;
            cursor: not-allowed;
        }

        .file-info {
            font-size: 0.85rem;
            color: var(--accent);
            margin-top: 8px;
            font-weight: 500;
            text-align: center;
        }

        footer {
            margin-top: 25px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        @media (max-width: 480px) {
            .controls {
                grid-template-columns: 1fr;
            }
            .control-group.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>RandoVol</h1>
        <p class="subtitle">Convertissez vos tracés KML/GPX en visites 3D pour Google Earth</p>
    </header>

    <div class="drop-zone" id="dropZone">
        <p>Glissez-déposez votre fichier KML ou GPX ici</p>
        <span>ou cliquez pour parcourir</span>
        <input type="file" id="fileInput" accept=".kml,.gpx">
    </div>
    <div class="file-info" id="fileInfo"></div>

    <div class="controls">
        <div class="control-group">
            <label for="altitude">Altitude caméra (m) :</label>
            <input type="number" id="altitude" value="150" min="30" max="2000">
        </div>
        <div class="control-group">
            <label for="tilt">Inclinaison / Tilt (°) :</label>
            <input type="number" id="tilt" value="65" min="0" max="85">
        </div>
        <div class="control-group">
            <label for="stepDistance">Échantillonnage (m) :</label>
            <input type="number" id="stepDistance" value="30" min="5" max="500">
        </div>
        <div class="control-group">
            <label for="speed">Vitesse de survol (km/h) :</label>
            <input type="number" id="speed" value="60" min="10" max="500">
        </div>
        <div class="control-group full-width">
            <label for="range">Distance focalisation / Range (m) :</label>
            <input type="number" id="range" value="300" min="50" max="2000">
        </div>
    </div>

    <button id="generateBtn" class="btn" disabled>Générer le fichier KMZ</button>

    <footer>
        <p>RandoVol PWA — Fonctionne 100% hors-ligne dans votre navigateur.</p>
    </footer>
</div>

<script src="app.js"></script>
<script>
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW RandoVol enregistré:', reg.scope))
                .catch(err => console.error('Erreur SW:', err));
        });
    }
</script>
</body>
</html>
